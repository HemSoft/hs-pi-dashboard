<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Fleet Dashboard</title>
<style>
  :root {
    --gold: #ffd700;
    --gold-dim: #b89b23;
    --bg: #050505;
    --card: #0d0d0d;
    --card-border: #262626;
    --text: #e8e4d8;
    --muted: #8a8578;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--card-border); padding-bottom: 14px; margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 12px; }
  .sub b { color: var(--gold-dim); font-weight: 500; }
  .refresh { margin-left: auto; color: var(--muted); font-size: 12px; }
  .refresh .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .usage-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer; padding: 10px 2px;
    color: var(--gold); font-family: inherit; font-size: 14px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; text-align: left;
    border-bottom: 1px solid var(--card-border); margin-bottom: 14px;
  }
  .usage-toggle .chev { display: inline-block; transition: transform .15s; color: var(--gold-dim); }
  .usage-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .usage-toggle .hint { color: var(--muted); font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: auto; }
  .usage-body.collapsed { display: none; }

  .pulse-panel {
    position: relative; overflow: hidden; min-height: 184px; margin-bottom: 18px;
    background: #000603; border: 1px solid #123c24; border-radius: 4px;
    box-shadow: inset 0 0 24px rgba(0, 255, 102, .06), 0 0 12px rgba(0, 255, 102, .04);
  }
  .pulse-readout {
    position: absolute; z-index: 2; top: 12px; left: 14px;
    display: flex; align-items: baseline; gap: 9px; pointer-events: none;
    text-shadow: 0 0 8px rgba(50, 255, 126, .7);
  }
  .pulse-count { color: #32ff7e; font-size: 34px; font-weight: 700; line-height: 1; }
  .pulse-label { color: #7ee8a6; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .pulse-screen { position: relative; height: 182px; }
  .pulse-screen::after {
    content: ""; position: absolute; z-index: 1; top: 8px; bottom: 8px; left: 75%; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(50, 255, 126, .2) 22%, rgba(50, 255, 126, .06) 78%, transparent);
    box-shadow: 0 0 9px rgba(50, 255, 126, .16); pointer-events: none;
  }
  .pulse-canvas {
    display: block; width: 100%; height: 182px;
    filter: drop-shadow(0 0 4px rgba(50, 255, 126, .72));
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,.75) 30%, #000 62%, #000 76%, transparent 77%);
    mask-image: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,.75) 30%, #000 62%, #000 76%, transparent 77%);
  }
  .pulse-cursor {
    position: absolute; z-index: 3; left: 75%; bottom: 9px; width: 10px; height: 10px;
    border: 1px solid rgba(210, 255, 225, .9); border-radius: 50%; background: #32ff7e;
    box-shadow: 0 0 5px #32ff7e, 0 0 13px rgba(50, 255, 126, .9), 0 0 25px rgba(50, 255, 126, .45);
    transform: translate(-50%, 50%); transition: bottom 42ms linear; pointer-events: none;
    animation: pulse-cursor-breathe 1.8s ease-in-out infinite;
  }
  .pulse-cursor.beat { animation: pulse-cursor-beat .52s ease-out; }
  @keyframes pulse-cursor-breathe {
    0%, 100% { box-shadow: 0 0 4px #32ff7e, 0 0 10px rgba(50, 255, 126, .65), 0 0 20px rgba(50, 255, 126, .28); }
    50% { box-shadow: 0 0 7px #32ff7e, 0 0 17px rgba(50, 255, 126, .95), 0 0 29px rgba(50, 255, 126, .48); }
  }
  @keyframes pulse-cursor-beat {
    0% { box-shadow: 0 0 5px #32ff7e, 0 0 12px rgba(50, 255, 126, .8); }
    35% { box-shadow: 0 0 9px #b9ffd1, 0 0 23px #32ff7e, 0 0 42px rgba(50, 255, 126, .9); }
    100% { box-shadow: 0 0 5px #32ff7e, 0 0 13px rgba(50, 255, 126, .75); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-canvas { filter: drop-shadow(0 0 2px rgba(50, 255, 126, .45)); }
    .pulse-cursor, .pulse-cursor.beat { animation: none; transition: none; }
    .refresh .dot, .live { animation: none; }
  }
  /* Usage cards are account-level (merged across agents) and laid out as
     masonry columns of equal width: the compact cards (single-gauge
     speedometers + balances) stack in the first column so the money cards
     tuck directly under Codex, and each multi-gauge card gets its own
     column. A column holding a single card stretches it to the section
     height so all card bottoms align. */
  .usage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 980px) {
    .usage-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  }
  .usage-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .usage-col > .ucard:only-child:not(.collapsed) { flex: 1 1 auto; }
  .gauges { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .ucard {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 4px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .ucard-label { color: var(--gold); font-weight: 600; font-size: 13px; letter-spacing: .5px; }
  .ucard-error { color: var(--muted); font-size: 11.5px; font-style: italic; }
  .gauges { display: flex; flex-wrap: wrap; gap: 12px; }
  .gauge { display: flex; flex-direction: column; align-items: center; width: 118px; gap: 2px; }
  .gauge svg { width: 118px; height: 72px; }
  .gauge .glabel { color: var(--text); font-size: 11px; }
  .gauge .greset { color: var(--muted); font-size: 10px; }
  .gauge .gproj { font-size: 10px; color: var(--gold-dim); }
  .gauge .gproj.over { color: #ff6b6b; }
  .balance { display: flex; align-items: baseline; gap: 10px; }
  .balance .amount { color: var(--gold); font-size: 26px; font-weight: 600; }
  .usage-stale { color: var(--muted); font-size: 10px; }
  .ucard.collapsible { cursor: pointer; user-select: none; }
  .ucard.collapsible:hover { border-color: #3f3f3f; }
  .ucard .chev { color: var(--muted); font-size: 10px; transition: transform .15s; }
  .ucard.collapsed {
    flex-direction: row; align-items: baseline; flex-wrap: wrap;
    gap: 4px 10px; padding: 5px 12px; border-left-width: 2px;
    /* Row stretch would pin this card to its siblings' height with dead
       space beneath the chip; size to content instead. */
    align-self: start;
  }
  .ucard.collapsed .ucard-label { font-size: 12.5px; }
  .ucard.collapsed .ucard-compact { display: contents; }
  .ucard.collapsed .chev { margin-left: auto; transform: rotate(-90deg); }
  .ucard.collapsed .usage-stale { font-size: 9.5px; }
  .ucard-compact { display: flex; flex-wrap: wrap; gap: 6px; }
  .ucard-compact .mini {
    display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap;
    font-size: 11.5px; color: var(--text);
    background: #080808; border: 1px solid var(--card-border); border-radius: 3px; padding: 1px 7px;
  }
  .ucard-compact .mini .gproj { font-size: 10.5px; }

  .session-table-wrap { border: 1px solid var(--card-border); border-radius: 4px; background: var(--card); }
  .session-table {
    width: 100%; border-collapse: collapse; font-size: 11px;
    table-layout: fixed;
  }
  .session-table th {
    position: sticky; top: 0; background: var(--card);
    color: var(--muted); font: 600 10px ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: .05em; text-align: left; padding: 6px 10px;
    border-bottom: 1px solid var(--card-border);
    white-space: nowrap;
  }
  .session-table td {
    padding: 6px 10px; border-bottom: 1px solid var(--card-border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* computer / title / provider / model / effort / msgs / started / price / duration */
  .session-table th:nth-child(1), .session-table td:nth-child(1) { width: 14%; }
  .session-table th:nth-child(2), .session-table td:nth-child(2) { width: 20%; }
  .session-table th:nth-child(3), .session-table td:nth-child(3) { width: 16%; }
  .session-table th:nth-child(4), .session-table td:nth-child(4) { width: 12%; }
  .session-table th:nth-child(5), .session-table td:nth-child(5) { width: 6%; }
  .session-table th:nth-child(6), .session-table td:nth-child(6) { width: 6%; }
  .session-table th:nth-child(7), .session-table td:nth-child(7) { width: 8%; }
  .session-table th:nth-child(8), .session-table td:nth-child(8) { width: 8%; }
  .session-table th:nth-child(9), .session-table td:nth-child(9) { width: 10%; }
  .session-table tr.machine-head td {
    background: #080808; color: var(--gold);
    font-size: 11px; letter-spacing: 1px;
  }
  .session-table tr.machine-head .state { font-size: 10px; padding: 1px 6px; border: 1px solid; border-radius: 3px; }
  .session-table tr.machine-head .state.online { color: var(--gold); border-color: var(--gold-dim); }
  .session-table tr.machine-head .state.offline { color: var(--muted); border-color: var(--card-border); }
  .session-table tr.empty-row td { color: var(--muted); font-style: italic; border-bottom: 0; }
  .session-table tr.active td { background: rgba(255, 215, 0, .07); }
  .session-table tr.offline td { opacity: .45; }
  .session-table tr.flash td { animation: row-flash 1.2s ease-out; }
  @keyframes row-flash {
    from { background-color: rgba(255, 215, 0, .22); }
    to { background-color: transparent; }
  }
  .session-table tr:last-child td { border-bottom: 0; }
  .session-table tr.has-sub td { border-bottom: 0; }
  .session-table tr.subrow td {
    background: #0b0b0a; border-bottom: 1px solid var(--card-border);
    padding: 3px 10px 5px 26px;
  }
  .session-table tr.subrow td > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .session-table .out-text {
    color: var(--text); opacity: .8; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden;
  }
  .session-table .out-age { color: var(--muted); font-size: 10.5px; padding-top: 1px; }
  .session-table tr.toggleable { cursor: pointer; }
  .session-table .out-chev { color: var(--muted); display: inline-block; width: 12px; }
  .session-table tr.toggleable:hover .out-chev { color: var(--gold); }
  .pager { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; color: var(--muted); font-size: 11px; }
  .pager-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--gold-dim); border-radius: 3px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .pager-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-dim); }
  .pager-btn:disabled { opacity: .35; cursor: default; }
  .pager-count { margin-left: auto; }
  .session-table .title { color: var(--gold); font-weight: 600; max-width: 300px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.5s infinite; flex: none; }
  .idle-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex: none; }
  .empty-line { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 0 8px; }
  footer { margin-top: 12px; color: var(--muted); font-size: 11px; }
  footer a { color: var(--gold-dim); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Pi Fleet Dashboard</h1>
  <span class="sub" id="generated"></span>
  <span class="refresh"><span class="dot"></span>live · refresh 5s</span>
</header>
<section class="usage-section">
  <button id="usage-toggle" class="usage-toggle" aria-expanded="true">
    <span class="chev">▾</span> Usage &amp; Balances
    <span class="hint">plan speedometers · balances · agent polls every 60s</span>
  </button>
  <div id="usage-body" class="usage-body"><p class="empty">loading usage…</p></div>
</section>
<section class="pulse-section">
  <button id="pulse-toggle" class="usage-toggle" aria-expanded="true" aria-controls="pulse-body">
    <span class="chev">▾</span> Pulse
    <span class="hint">live activity cursor · peak = active total</span>
  </button>
  <div id="pulse-body" class="usage-body" aria-labelledby="pulse-toggle">
    <div class="pulse-panel">
      <div class="pulse-readout" aria-live="polite" aria-atomic="true">
        <span id="pulse-count" class="pulse-count">0</span>
        <span id="pulse-label" class="pulse-label">active sessions</span>
      </div>
      <div class="pulse-screen">
        <canvas id="pulse-canvas" class="pulse-canvas" width="960" height="182" role="img" aria-label="0 active agent sessions"></canvas>
        <span id="pulse-cursor" class="pulse-cursor" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</section>
<main id="app"><p class="empty">loading fleet…</p></main>
<footer>hs-pi-dashboard · <a href="/api/fleet">/api/fleet</a></footer>

<script src="/assets/smoothie-1.36.1.js"></script>
<script>
const esc = (s) => (s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rel(ts) {
  if (!ts) return "—";
  const d = (Date.now() - new Date(ts).getTime()) / 1000;
  if (d < 5) return "now";
  if (d < 90) return Math.round(d) + "s ago";
  if (d < 5400) return Math.round(d / 60) + "m ago";
  if (d < 172800) return Math.round(d / 3600) + "h ago";
  return Math.round(d / 86400) + "d ago";
}

// Compact no-seconds duration, statusline style: "42m" / "5h 4m" / "6d 18h".
function compactDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + (m % 60) + "m";
  const d = Math.floor(h / 24);
  return d + "d " + (h % 24) + "h";
}

// Live reset countdown: recomputed every render so cached agent data never
// shows a stale "resets now".
function resetCountdown(resetAt) {
  if (!resetAt) return "";
  const ms = new Date(resetAt).getTime() - Date.now();
  if (ms <= 0) return "resetting…";
  return "resets in " + compactDur(ms);
}

// Session span. Active sessions are still growing, so measure to now (this
// recomputes on every 5s render); ended/idle ones measure to their last
// write — Hermes folds endedAt into lastActivity upstream.
function durationOf(s) {
  if (!s.startedAt) return "";
  const start = new Date(s.startedAt).getTime();
  const end = s.active ? Date.now() : new Date(s.lastActivity || s.startedAt).getTime();
  const ms = end - start;
  if (!Number.isFinite(ms) || ms < 0) return "";
  return compactDur(ms);
}

// --- usage speedometers -----------------------------------------------------
// Gauges represent USAGE (0% = empty and bright green, 100% = full and dark
// red) on the statusline's green→red scale, drawn on a 3D-bezel dial.

const USAGE_SCALE = [
  [50, "#00ff00"], // bright green
  [65, "#00af00"], // green
  [75, "#ff9500"], // orange
  [85, "#ffff00"], // yellow
  [92, "#ff2b2b"], // bright red
  [97, "#d70000"], // red
  [101, "#870000"], // dark red
];
function usageColor(pct) {
  for (const [max, color] of USAGE_SCALE) if (pct < max) return color;
  return USAGE_SCALE[USAGE_SCALE.length - 1][1];
}

let gaugeUID = 0;

function polar(cx, cy, r, deg) {
  // deg 180 = left edge, 270 = top, 360 = right edge (SVG y-down coordinates).
  const a = ((deg - 180) * Math.PI) / 180;
  return [cx - r * Math.cos(a), cy - r * Math.sin(a)];
}

// Arc swept clockwise from `startDeg` (180 = left edge) to `endDeg`
// (360 = right edge) over the top of the dial.
function arcPath(cx, cy, r, startDeg, endDeg) {
  const [sx, sy] = polar(cx, cy, r, startDeg);
  const [ex, ey] = polar(cx, cy, r, endDeg);
  const large = endDeg - startDeg > 180 ? 1 : 0;
  return `M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${ex.toFixed(2)} ${ey.toFixed(2)}`;
}

function gaugeSvg(g) {
  const used = Math.max(0, Math.min(100, g.usedPercent ?? 0));
  const color = usageColor(used);
  const id = "hg" + (++gaugeUID);
  const cx = 60, cy = 56, r = 44;
  const sweep = (used / 100) * 180;
  const endDeg = 180 + sweep;
  const [capX, capY] = polar(cx, cy, r - 2, endDeg);

  // Ghost projection: a glassy translucent arc from current usage to where
  // the current pace would land at reset (capped at the dial edge; the exact
  // number lives in the proj chip). A notch separates it from the measured
  // arc; frosted halo + specular streak + rim lights give it a distinct
  // "future pane" material. Overshoots tint the glass alarm red.
  let ghost = "";
  if (g.projectedEnd != null) {
    const proj = Math.max(0, Math.min(100, g.projectedEnd));
    const projDeg = 180 + (proj / 100) * 180;
    if (projDeg - endDeg > 1) {
      const [px, py] = polar(cx, cy, r, projDeg);
      const over = g.projectedEnd > 100;
      const projColor = over ? "#ff6b6b" : usageColor(proj);
      const gapDeg = 2.5;
      const gStart = Math.min(endDeg + gapDeg, projDeg);
      ghost =
        `<path d="${arcPath(cx, cy, r, gStart, projDeg)}" stroke="${projColor}" stroke-width="15" fill="none" stroke-linecap="butt" opacity=".22" filter="url(#${id}-frost)"/>` +
        `<path d="${arcPath(cx, cy, r, gStart, projDeg)}" stroke="${projColor}" stroke-width="11" fill="none" stroke-linecap="butt" opacity=".5"/>` +
        `<path d="${arcPath(cx, cy, r - 3, gStart, projDeg)}" stroke="rgba(255,255,255,.5)" stroke-width="2.2" fill="none" stroke-linecap="round"/>` +
        `<path d="${arcPath(cx, cy, r + 5, gStart, projDeg)}" stroke="rgba(255,255,255,.28)" stroke-width="1" fill="none"/>` +
        `<path d="${arcPath(cx, cy, r - 5, gStart, projDeg)}" stroke="rgba(0,0,0,.45)" stroke-width="1" fill="none"/>` +
        `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" fill="${projColor}" fill-opacity=".75" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/><title>projected ${Math.round(g.projectedEnd)}% at reset</title>`;
    }
  }

  const ticks = [];
  for (let t = 0; t <= 100; t += 10) {
    const deg = 180 + (t / 100) * 180;
    const [x1, y1] = polar(cx, cy, r + 7, deg);
    const [x2, y2] = polar(cx, cy, r + (t % 25 === 0 ? 10.5 : 9), deg);
    ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${t % 25 === 0 ? "#4a4436" : "#232323"}" stroke-width="1"/>`);
  }

  const face = `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy} L ${cx - r} ${cy} Z`;

  return `
  <div class="gauge">
    <svg viewBox="0 0 120 76" role="img" aria-label="${esc(g.label)}: ${Math.round(used)}% used">
      <defs>
        <linearGradient id="${id}-bezel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#333333"/>
          <stop offset=".55" stop-color="#161616"/>
          <stop offset="1" stop-color="#050505"/>
        </linearGradient>
        <radialGradient id="${id}-face" cx=".5" cy=".85" r="1">
          <stop offset="0" stop-color="#000000"/>
          <stop offset=".8" stop-color="#0d0d0d"/>
          <stop offset="1" stop-color="#181818"/>
        </radialGradient>
        <filter id="${id}-frost" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>
        <filter id="${id}-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity=".9"/>
        </filter>
      </defs>
      <g filter="url(#${id}-shadow)">
        <path d="${face}" fill="url(#${id}-face)" stroke="#2a2a2a" stroke-width="1"/>
        <path d="${arcPath(cx, cy, r + 6, 180, 360)}" stroke="#3d3d3d" stroke-width="1.2" fill="none"/>
        <path d="${arcPath(cx, cy, r, 180, 360)}" stroke="url(#${id}-bezel)" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="${arcPath(cx, cy, r, 180, 360)}" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
        ${ticks.join("")}
        ${ghost}
        ${sweep > 0.4 ? `
        <path d="${arcPath(cx, cy, r, 180, endDeg)}" stroke="${color}" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="${arcPath(cx, cy, r - 3.5, 180, Math.max(180.5, endDeg - 1))}" stroke="rgba(255,255,255,.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="${capX.toFixed(1)}" cy="${capY.toFixed(1)}" r="3.2" fill="#ffffff" opacity=".55"/>` : `
        <circle cx="${polar(cx, cy, r, 180)[0].toFixed(1)}" cy="${polar(cx, cy, r, 180)[1].toFixed(1)}" r="4" fill="${color}"/>`}
      </g>
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="${color}" font-size="17" font-weight="700" font-family="inherit">${Math.round(used)}%</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#8a8578" font-size="8.5">used</text>
    </svg>
    <span class="glabel">${esc(g.label)}</span>
    <span class="greset">${resetCountdown(g.resetAt)}</span>
    ${g.projectedEnd != null ? (() => {
      const p = Math.round(g.projectedEnd);
      return `<span class="gproj ${p > 100 ? "over" : ""}" title="projected end-of-window usage at the current pace">⇗ proj ${p}%</span>`;
    })() : ""}
  </div>`;
}

function usageCard(card, machine) {
  const collapsible = card.kind !== "unknown";
  const collapsed = collapsible && cardCollapsed(machine, card.key);
  const chev = collapsible
    ? `<span class="chev" title="${collapsed ? "expand" : "collapse"}">▾</span>`
    : "";
  const age = card.fetchedAt ? `<span class="usage-stale" title="${esc(card.fetchedAt)}">· ${rel(card.fetchedAt)}</span>` : "";

  let body = "";
  if (collapsed) {
    body = compactBody(card);
  } else if (card.kind === "quota") {
    body = card.gauges?.length
      ? `<div class="gauges">${card.gauges.map(gaugeSvg).join("")}</div>`
      : `<span class="ucard-error">${esc(card.error || "no data")}</span>`;
  } else if (card.kind === "balance") {
    body = card.balanceUsd != null
      ? `<div class="balance"><span class="amount">$${card.balanceUsd.toFixed(2)}</span></div>`
      : `<span class="ucard-error">${esc(card.error || "unknown")}</span>`;
  } else {
    body = `<span class="ucard-error">${esc(card.error || "no usage source yet")}</span>`;
  }

  const attrs = collapsible
    ? ` role="button" tabindex="0" data-machine="${esc(machine)}" data-key="${esc(card.key)}" `
      + `onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"`
    : "";

  if (collapsed) {
    return `
  <div class="ucard collapsible collapsed"${attrs}>
    <span class="ucard-label">${esc(card.label)}</span>
    ${compactBody(card)}
    <span class="usage-stale" title="${esc(card.fetchedAt || "")}">· ${rel(card.fetchedAt)}</span>
    <span class="chev" title="expand">▾</span>
  </div>`;
  }

  return `
  <div class="ucard ${collapsible ? "collapsible" : ""}"${attrs}>
    <div class="ucard-label" style="display:flex;justify-content:space-between;align-items:baseline">${esc(card.label)}${age}
      ${chev}
    </div>
    ${body}
  </div>`;
}

// compactBody is the collapsed "numbers only" strip: colored used-percent
// per window with its projection, or the prepaid balance.
function compactBody(card) {
  if (card.kind === "quota") {
    const minis = (card.gauges || []).map((g) => {
      const pct = Math.round(g.usedPercent);
      const proj = g.projectedEnd != null
        ? (() => {
            const p = Math.round(g.projectedEnd);
            return `<span class="gproj ${p > 100 ? "over" : ""}">⇗${p}%</span>`;
          })()
        : "";
      return `<span class="mini"><b style="color:${usageColor(g.usedPercent)}">${pct}%</b> ${esc(g.label)}${proj}</span>`;
    }).join("");
    return `<div class="ucard-compact">${minis || `<span class="ucard-error">${esc(card.error || "no data")}</span>`}</div>`;
  }
  if (card.kind === "balance") {
    return card.balanceUsd != null
      ? `<div class="ucard-compact"><span class="mini"><b style="color:var(--gold)">$${card.balanceUsd.toFixed(2)}</b></span></div>`
      : `<div class="ucard-compact"><span class="ucard-error">${esc(card.error || "unknown")}</span></div>`;
  }
  return `<span class="ucard-error">${esc(card.error || "")}</span>`;
}

let lastFleet = null;

// --- fleet pulse -----------------------------------------------------------
// The trace samples a baseline continuously so time visibly moves beneath the
// live cursor. A meaningful update to an active row drives one short monitor
// pulse whose peak is the current active-session total.
const PULSE_TOGGLE_KEY = "hs-pi-dashboard:pulse-open";
const PULSE_CURSOR_RATIO = .75;
const PULSE_MILLIS_PER_PIXEL = 25;
const PULSE_SAMPLE_MS = 33;
const PULSE_HISTORY_MS = 2 * 60 * 1000;
const PULSE_SHAPE = [
  [0, 0], [35, .1], [58, 0], [92, 0], [125, 1],
  [170, 1], [210, .08], [275, .22], [410, 0],
];
const PULSE_DURATION_MS = PULSE_SHAPE[PULSE_SHAPE.length - 1][0];
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let pulseChart = null;
let pulseSeries = null;
let pulseSampleTimer = null;
let pulseStartedAt = null;
let pulsePeak = 0;
let pulseScaleFloor = 0;
let pulseDisplayRange = { min: -.025, max: 1.12 };
let pulseCursorBeatTimer = null;

function pulseOpen() {
  return document.getElementById("pulse-toggle").getAttribute("aria-expanded") === "true";
}

function pulseYRange(seriesMax = 0) {
  const safeMax = Math.max(1, Number.isFinite(seriesMax) ? seriesMax : 0, pulseScaleFloor);
  pulseDisplayRange = { min: -safeMax * .025, max: safeMax * 1.12 };
  return pulseDisplayRange;
}

function syncPulseDelay() {
  if (!pulseChart) return;
  const canvas = document.getElementById("pulse-canvas");
  const width = canvas.clientWidth || canvas.width;
  pulseChart.delay = -Math.round(width * PULSE_MILLIS_PER_PIXEL * (1 - PULSE_CURSOR_RATIO));
}

function updatePulseCursor(value) {
  const cursor = document.getElementById("pulse-cursor");
  const screen = cursor.parentElement;
  const range = pulseDisplayRange.max - pulseDisplayRange.min;
  const ratio = range > 0 ? (value - pulseDisplayRange.min) / range : 0;
  const bottom = Math.max(6, Math.min(screen.clientHeight - 6, ratio * screen.clientHeight));
  cursor.style.bottom = `${bottom}px`;
}

function pulseValueAt(now) {
  if (pulseStartedAt === null) return 0;
  const elapsed = now - pulseStartedAt;
  if (elapsed < 0 || elapsed >= PULSE_DURATION_MS) {
    pulseStartedAt = null;
    return 0;
  }
  for (let i = 1; i < PULSE_SHAPE.length; i++) {
    const [rightTime, rightValue] = PULSE_SHAPE[i];
    if (elapsed <= rightTime) {
      const [leftTime, leftValue] = PULSE_SHAPE[i - 1];
      const progress = (elapsed - leftTime) / (rightTime - leftTime);
      return pulsePeak * (leftValue + (rightValue - leftValue) * progress);
    }
  }
  return 0;
}

function samplePulse(now = Date.now()) {
  if (!pulseSeries) return;
  const value = pulseValueAt(now);
  pulseSeries.append(now, value);
  pulseSeries.dropOldData(now - PULSE_HISTORY_MS, 2);
  updatePulseCursor(value);
}

function startPulseSampling() {
  if (pulseSampleTimer !== null) return;
  samplePulse();
  pulseSampleTimer = setInterval(samplePulse, PULSE_SAMPLE_MS);
}

function stopPulseSampling() {
  if (pulseSampleTimer === null) return;
  clearInterval(pulseSampleTimer);
  pulseSampleTimer = null;
}

function renderStaticPulse(renderAt = Date.now()) {
  if (!pulseChart || !pulseOpen() || document.hidden) return;
  pulseChart.resize();
  syncPulseDelay();
  pulseChart.render(document.getElementById("pulse-canvas"), renderAt);
}

function syncPulseMotion() {
  if (!pulseChart) return;
  const visible = pulseOpen() && !document.hidden;
  const animate = visible && !reducedMotion.matches;
  if (animate) {
    pulseChart.start();
    startPulseSampling();
  } else {
    stopPulseSampling();
    pulseChart.stop();
    if (visible) samplePulse();
    renderStaticPulse();
  }
}

function triggerActivityPulse(count) {
  if (!pulseSeries || !pulseOpen() || document.hidden || count <= 0) return;
  const now = Date.now();
  pulsePeak = count;
  pulseScaleFloor = count;
  pulseYRange(count);
  const cursor = document.getElementById("pulse-cursor");

  if (reducedMotion.matches) {
    for (const [offset, value] of PULSE_SHAPE) {
      pulseSeries.append(now - PULSE_DURATION_MS + offset, count * value);
    }
    pulseSeries.append(now, 0);
    pulseSeries.dropOldData(now - PULSE_HISTORY_MS, 2);
    updatePulseCursor(0);
    renderStaticPulse(now);
    return;
  }

  pulseStartedAt = now;
  cursor.classList.remove("beat");
  void cursor.offsetWidth;
  cursor.classList.add("beat");
  clearTimeout(pulseCursorBeatTimer);
  pulseCursorBeatTimer = setTimeout(() => cursor.classList.remove("beat"), 520);
}

function initPulse() {
  const canvas = document.getElementById("pulse-canvas");
  const toggle = document.getElementById("pulse-toggle");
  const body = document.getElementById("pulse-body");
  pulseSeries = new TimeSeries();
  const initialSampleAt = Date.now();
  pulseSeries.append(initialSampleAt - PULSE_HISTORY_MS, 0);
  pulseSeries.append(initialSampleAt, 0);
  pulseChart = new SmoothieChart({
    responsive: true,
    millisPerPixel: PULSE_MILLIS_PER_PIXEL,
    interpolation: "linear",
    scaleSmoothing: 1,
    yRangeFunction: ({ max }) => pulseYRange(max),
    grid: {
      fillStyle: "#000603",
      strokeStyle: "rgba(50,255,126,.11)",
      lineWidth: 1,
      millisPerLine: 5000,
      verticalSections: 4,
      sharpLines: true,
    },
    labels: { disabled: true },
  });
  pulseChart.addTimeSeries(pulseSeries, {
    strokeStyle: "#32ff7e",
    lineWidth: 2.5,
    interpolation: "linear",
  });
  pulseChart.streamTo(canvas, 0);
  syncPulseDelay();
  updatePulseCursor(0);

  const apply = (open) => {
    toggle.setAttribute("aria-expanded", String(open));
    body.classList.toggle("collapsed", !open);
    syncPulseMotion();
  };
  const saved = localStorage.getItem(PULSE_TOGGLE_KEY);
  apply(saved === null ? true : saved === "true");
  toggle.addEventListener("click", () => {
    const open = !pulseOpen();
    apply(open);
    localStorage.setItem(PULSE_TOGGLE_KEY, String(open));
  });
  document.addEventListener("visibilitychange", syncPulseMotion);
  reducedMotion.addEventListener?.("change", syncPulseMotion);
  window.addEventListener("resize", () => {
    pulseChart.resize();
    syncPulseDelay();
    updatePulseCursor(pulseValueAt(Date.now()));
    if (reducedMotion.matches) renderStaticPulse();
  });
}

function updatePulse(fleet) {
  const count = Number.isFinite(fleet.activeSessions) ? fleet.activeSessions : 0;
  pulseScaleFloor = count;
  pulseYRange(count);
  const countEl = document.getElementById("pulse-count");
  const labelEl = document.getElementById("pulse-label");
  const canvas = document.getElementById("pulse-canvas");
  countEl.textContent = String(count);
  labelEl.textContent = count === 1 ? "active session" : "active sessions";
  canvas.setAttribute("aria-label", `${count} active agent ${count === 1 ? "session" : "sessions"}`);
}

function activePiSessionCount(fleet) {
  return (fleet.machines || []).reduce((total, machine) => {
    if (!machine.online) return total;
    if (Number.isFinite(machine.activeSessions)) return total + machine.activeSessions;
    return total + (machine.sessions || []).filter(session => session.active).length;
  }, 0);
}

function cardCollapsed(machine, key) {
  return localStorage.getItem("hs-pi-dashboard:card-collapsed:" + machine + ":" + key) === "1";
}

function toggleCard(machine, key) {
  const storageKey = "hs-pi-dashboard:card-collapsed:" + machine + ":" + key;
  localStorage.setItem(storageKey, cardCollapsed(machine, key) ? "0" : "1");
  if (lastFleet) renderUsage(lastFleet);
}

function bindUsageCardToggles() {
  document.getElementById("usage-body").addEventListener("click", (e) => {
    const el = e.target.closest(".ucard.collapsible");
    if (el) toggleCard(el.dataset.machine, el.dataset.key);
  });
}

function renderUsage(fleet) {
  const body = document.getElementById("usage-body");
  const machines = (fleet.machines ?? []).filter((m) => m.usage && m.usage.cards?.length);
  if (!machines.length) {
    body.innerHTML = '<p class="empty">no usage reporters online yet</p>';
    return;
  }
  // Usage cards are account-level, not per machine: several agents report the
  // same subscriptions, so merge them by key and keep the healthiest, freshest
  // card for each. One global set: speedometers on top, balances underneath.
  const byKey = new Map();
  for (const m of machines) {
    for (const c of m.usage.cards) {
      const prev = byKey.get(c.key);
      const better = !prev
        || (prev.error && !c.error)
        || ((!!prev.error === !!c.error)
            && new Date(c.fetchedAt || 0) > new Date(prev.fetchedAt || 0));
      if (better) byKey.set(c.key, c);
    }
  }
  const cards = [...byKey.values()];
  // Masonry columns: column 1 stacks the compact cards — single-gauge
  // speedometers with the balances tucked directly underneath; every other
  // speedometer card gets its own column (extras round-robin over columns
  // 2-3). All cards render content-sized, so the section stays tight.
  const isSolo = (c) => c.kind === "quota" && c.gauges?.length === 1;
  const col1 = [
    ...cards.filter((c) => isSolo(c)),
    ...cards.filter((c) => c.kind !== "quota"),
  ];
  const multis = cards.filter((c) => c.kind === "quota" && !isSolo(c));
  const cols = [col1];
  multis.forEach((c, i) => (cols[1 + (i % 2)] ??= []).push(c));
  body.innerHTML =
    `<div class="usage-grid">${cols.map((col) =>
      `<div class="usage-col">${col.map((c) => usageCard(c, "global")).join("")}</div>`).join("")}</div>`;
}

const USAGE_TOGGLE_KEY = "hs-pi-dashboard:usage-open";
function initUsageToggle() {
  const toggle = document.getElementById("usage-toggle");
  const body = document.getElementById("usage-body");
  const apply = (open) => {
    toggle.setAttribute("aria-expanded", String(open));
    body.classList.toggle("collapsed", !open);
  };
  const saved = localStorage.getItem(USAGE_TOGGLE_KEY);
  apply(saved === null ? true : saved === "true");
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") !== "true";
    apply(open);
    localStorage.setItem(USAGE_TOGGLE_KEY, String(open));
  });
}

// Row signature tracks meaningful session state. A signature change means
// the 5s poll just delivered something new; those rows flash on render.
const sessionSig = (s) => {
  const project = s.project || s.cwd?.split(/[\\/]/).filter(Boolean).pop() || s.id?.slice(0, 8) || "session";
  return [s.id, project, s.provider || "", s.model || "", s.thinkingLevel || "",
    s.messageCount || 0, s.toolCallCount || 0, s.inputTokens || 0, s.outputTokens || 0,
    +(s.costUsd || 0).toFixed(4), !!s.active, s.lastActivity || "",
    (s.outputs || []).map((o) => o.at).join(",")].join("|");
};
let lastSigs = {};
let sessionBaselineReady = false;
let activeFlashDetected = false;
const flashingSessions = new Map();
const ROW_FLASH_MS = 1200;
// Sessions whose output rows are expanded (default: collapsed). Keys match
// the row keys below, so the choice survives the 5s re-render.
const expandedOutputs = new Set();
// Table paging: 20 sessions per page; state survives the 5s re-render.
const PAGE_SIZE = 20;
let currentPage = 1;

// Any session with stored output can be expanded, however old it is; the
// only gate is that visible output exists at all. Expansion is purely
// user-driven (default collapsed) and persists across re-renders.
function availableOutputs(s) {
  const outs = s.outputs || [];
  return outs.length ? outs : null;
}

// Pure renderer for one session's output rows (newest first).
function renderOutputRows(outs, flash) {
  return outs.map((o, i) => {
    const age = Date.now() - new Date(o.at).getTime();
    if (!Number.isFinite(age) || age < 0) return "";
    const cls = "subrow" + (i === 0 && flash ? " flash" : "");
    return `
  <tr class="${cls}"><td colspan="9"><div>
    <span class="out-text" title="${esc(o.text)}">${esc(o.text)}</span>
    <span class="out-age" title="${esc(o.at)}">${compactDur(age)}</span>
  </div></td></tr>`;
  }).join("");
}

function sessionsTable(machines, hermesSessions) {
  const newSigs = {};
  const flat = [];
  (machines ?? []).forEach((m) => {
    (m.sessions ?? []).forEach((s) => {
      newSigs[m.name + "/" + (s.id || "")] = sessionSig(s);
      flat.push({ s, m, kind: "pi" });
    });
  });
  (hermesSessions ?? []).forEach((s) => {
    const profileAlias = { default: "COS", janitor: "Janitor", developer: "Developer" }[s.profile] || s.profile;
    const entry = {
      id: s.id,
      cwd: s.cwd || "~/.hermes",
      project: (s.name || s.source + ":" + (s.id || "").slice(0, 8)) + (profileAlias ? " [" + profileAlias + "]" : ""),
      provider: "hermes:" + (s.profile || "unknown"),
      model: s.model || "",
      thinkingLevel: "",
      messageCount: s.messageCount || 0,
      toolCallCount: s.toolCallCount || 0,
      inputTokens: s.inputTokens || 0,
      outputTokens: s.outputTokens || 0,
      costUsd: s.estimatedCostUsd || 0,
      startedAt: s.startedAt,
      lastActivity: s.endedAt || s.lastActivity || s.startedAt,
      active: s.active === true,
      outputs: s.outputs || [],
    };
    newSigs["hermes/" + (s.id || "")] = sessionSig(entry);
    const machineLabel = "mini (" + (profileAlias || "hermes") + ")";
    flat.push({ s: entry, m: { name: machineLabel, online: true }, kind: "hermes" });
  });
  // Recency first: active sessions bubble ahead of idle.
  flat.sort((a, b) => {
    const aActive = a.kind === "hermes" ? a.s.active : (a.s.active && a.m.online);
    const bActive = b.kind === "hermes" ? b.s.active : (b.s.active && b.m.online);
    if (aActive !== bActive) return bActive - aActive;
    return new Date(b.s.lastActivity || 0) - new Date(a.s.lastActivity || 0);
  });
  // Quiet runs (no stored output) add no value here — drop them before
  // paging. The flash signature map above still covers every session, so a
  // quiet run that later speaks flashes when it first appears.
  const renderAt = Date.now();
  const entryKey = (entry) =>
    (entry.kind === "hermes" ? "hermes/" : entry.m.name + "/") + (entry.s.id || "");
  // Detect activity across the complete session set before pagination. An
  // active run can update while the operator is looking at another page.
  for (const entry of flat) {
    const key = entryKey(entry);
    const changed = sessionBaselineReady && lastSigs[key] !== newSigs[key];
    const live = entry.kind === "hermes" ? entry.s.active : (entry.s.active && entry.m.online);
    if (changed) flashingSessions.set(key, renderAt + ROW_FLASH_MS);
    if (changed && live) activeFlashDetected = true;
  }
  const visible = flat.filter((entry) => (entry.s.outputs || []).length > 0);
  const totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = visible.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  const rows = pageItems.map((entry) => {
    const key = entryKey(entry);
    const flash = (flashingSessions.get(key) || 0) > renderAt;
    const outs = availableOutputs(entry.s);
    const expandedNow = !!(outs && expandedOutputs.has(key));
    const subs = expandedNow ? renderOutputRows(outs, flash) : "";
    return sessionRow(entry.s, entry.m, flash, entry.kind, !!outs, expandedNow, key) + subs;
  });
  lastSigs = newSigs;
  for (const [key, expiresAt] of flashingSessions) {
    if (expiresAt <= Date.now() || !newSigs[key]) flashingSessions.delete(key);
  }
  // Hermes rows arrive via the Hermes feed regardless of machine state, so
  // the empty states below distinguish "nothing configured" from
  // "configured, but nothing has spoken yet".
  const body = flat.length === 0 ? `<tr class="empty-row"><td colspan="9">no machines configured</td></tr>`
    : visible.length === 0 ? `<tr class="empty-row"><td colspan="9">no sessions with output yet</td></tr>`
    : rows.join("");
  const pager = totalPages > 1 ? `
  <div class="pager">
    <button class="pager-btn" data-page="prev" ${currentPage <= 1 ? "disabled" : ""}>‹</button>
    <span class="pager-info">page ${currentPage} / ${totalPages}</span>
    <button class="pager-btn" data-page="next" ${currentPage >= totalPages ? "disabled" : ""}>›</button>
    <span class="pager-count">${visible.length} sessions</span>
  </div>` : "";
  return `
  ${pager}
  <div class="session-table-wrap">
    <table class="session-table">
      <thead>
        <tr>
          <th>computer</th><th>session title</th><th>provider</th><th>model</th><th>effort</th><th>msgs</th><th>started</th><th>price</th><th>duration</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

function sessionRow(s, m, flash, kind, avail, expandedNow, key) {
  const live = kind === "pi" ? (s.active && m.online) : s.active;
  const session = s.project || s.cwd?.split(/[\\/]/).filter(Boolean).pop() || s.id?.slice(0, 8) || "session";
  const provider = s.provider || "";
  const model = s.model || "";
  const effort = s.thinkingLevel || "";
  const msgs = s.messageCount ? String(s.messageCount) : "";
  // Started shown as a compact age (same format as duration); the exact
  // timestamp stays in the cell tooltip.
  const started = s.startedAt ? compactDur(Date.now() - new Date(s.startedAt).getTime()) : "";
  const dur = durationOf(s);
  const price = s.costUsd >= 0.00005 ? `$${s.costUsd.toFixed(s.costUsd < 0.01 ? 4 : 2)}` : "";
  // avail = fresh output exists (chevron + clickable); expandedNow = the
  // detail rows are actually rendered right now (border drops, chevron opens).
  const cls = (live ? "active" : "offline") + (flash ? " flash" : "")
    + (expandedNow ? " has-sub" : "") + (avail ? " toggleable" : "");
  const attrs = avail ? ` class="${cls}" data-skey="${esc(key)}"` : ` class="${cls}"`;
  return `
  <tr${attrs}>
    <td>${esc(m.name)}</td>
    <td class="title" title="${esc(kind === "hermes" ? (s.source + ":" + s.id) : (s.cwd || ""))}">${avail ? `<span class="out-chev">${expandedNow ? "▾" : "▸"}</span>` : ""}${esc(session)}</td>
    <td>${esc(provider)}</td>
    <td>${esc(model)}</td>
    <td>${esc(effort)}</td>
    <td>${msgs}</td>
    <td title="${esc(s.startedAt || "")}">${esc(started)}</td>
    <td>${price}</td>
    <td>${esc(dur)}</td>
  </tr>`;
}

let lastHermes = [];

// Full re-render from cached data; toggling a session calls this directly so
// the click lands instantly instead of waiting for the next poll.
function renderSessions() {
  if (!lastFleet) return;
  activeFlashDetected = false;
  document.getElementById("app").innerHTML = sessionsTable(lastFleet.machines, lastHermes);
  renderUsage(lastFleet);
  if (activeFlashDetected) triggerActivityPulse(lastFleet.activeSessions || 0);
}

const POLL_TIMEOUT_MS = 4500;
let tickInFlight = false;
async function tick() {
  if (tickInFlight) return;
  tickInFlight = true;
  const fleetController = new AbortController();
  const hermesController = new AbortController();
  const fleetTimeout = setTimeout(() => fleetController.abort(), POLL_TIMEOUT_MS);
  const hermesTimeout = setTimeout(() => hermesController.abort(), POLL_TIMEOUT_MS);
  const hermesPayloadPromise = fetch("/api/hermes-sessions", { signal: hermesController.signal })
    .then(response => response.ok ? response.json() : null)
    .catch(() => null);
  try {
    const fleetRes = await fetch("/api/fleet", { signal: fleetController.signal });
    const fleet = await fleetRes.json();
    document.getElementById("generated").innerHTML =
      `generated <b>${new Date(fleet.generatedAt).toLocaleTimeString()}</b>`;
    lastFleet = fleet;
    updatePulse(fleet);
    renderSessions();

    const hermesPayload = await hermesPayloadPromise;
    if (hermesPayload) {
      lastHermes = hermesPayload.sessions || [];
      const hermesActive = Number.isFinite(hermesPayload.activeSessions)
        ? hermesPayload.activeSessions
        : lastHermes.filter(session => session.active).length;
      lastFleet = {
        ...lastFleet,
        activeSessions: activePiSessionCount(lastFleet) + hermesActive,
      };
      updatePulse(lastFleet);
      renderSessions();
    }
  } catch (err) {
    document.getElementById("app").innerHTML = `<p class="empty">fleet unreachable: ${esc(String(err))}</p>`;
  } finally {
    if (lastFleet) sessionBaselineReady = true;
    clearTimeout(fleetTimeout);
    clearTimeout(hermesTimeout);
    fleetController.abort();
    hermesController.abort();
    tickInFlight = false;
  }
}

initUsageToggle();
bindUsageCardToggles();
initPulse();
tick();
setInterval(tick, 5000);
// Clicking a session row with fresh output toggles its detail rows; state
// lives in expandedOutputs so it survives the 5s re-render. Pager buttons
// share the same delegated listener.
document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest(".pager-btn");
  if (btn && !btn.disabled) {
    if (btn.dataset.page === "prev") currentPage--;
    if (btn.dataset.page === "next") currentPage++;
    renderSessions();
    return;
  }
  const row = e.target.closest("tr[data-skey]");
  if (!row) return;
  const key = row.dataset.skey;
  if (expandedOutputs.has(key)) expandedOutputs.delete(key);
  else expandedOutputs.add(key);
  renderSessions();
});
</script>
